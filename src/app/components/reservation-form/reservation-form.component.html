<app-home></app-home> <br><br>

<form [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Check in Date:</label>
    <input type="date" formControlName="checkInDate">
    <div class="error-text" *ngIf="reservationForm.get('checkInDate')?.invalid && reservationForm.get('checkInDate')?.touched">
      Check-in date is required
    </div>
  </div>
  <div>
    <label>Check out Date:</label>
    <input type="date" formControlName="checkOutDate">
    <div class="error-text" *ngIf="reservationForm.get('checkOutDate')?.invalid && reservationForm.get('checkOutDate')?.touched">
      Check-out date is required
    </div>
  </div>
  <div>
    <label>Guest Name:</label>
    <input type="text" formControlName="guestName">
    <div class="error-text" *ngIf="reservationForm.get('guestName')?.invalid && reservationForm.get('guestName')?.touched">
      Guest name is required
    </div>
  </div>
  <div>
    <label>Check Email:</label>
    <input type="email" formControlName="guestEmail">
    <div class="error-text" *ngIf="reservationForm.get('guestEmail')?.invalid && reservationForm.get('guestEmail')?.touched">
      Guest email is required
    </div>
  </div>
  <div>
    <label>Room Number:</label>
    <input type="number" formControlName="roomNumber">
    <div class="error-text" *ngIf="reservationForm.get('roomNumber')?.invalid && reservationForm.get('roomNumber')?.touched">
      Room number is required
    </div>
  </div>
  <button type="submit" [disabled]="reservationForm.invalid">Submit</button>
</form>
